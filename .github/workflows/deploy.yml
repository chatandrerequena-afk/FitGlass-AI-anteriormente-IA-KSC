name: Deploy FitGlass AI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject educational Secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path("config.js")
          text=p.read_text(encoding="utf-8")
          text=text.replace("__GROQ_API_KEY__",os.environ.get("GROQ_API_KEY",""))
          text=text.replace("__USDA_API_KEY__",os.environ.get("USDA_API_KEY",""))
          text=text.replace("__FIREBASE_API_KEY__",os.environ.get("FIREBASE_API_KEY",""))
          text=text.replace("__FIREBASE_AUTH_DOMAIN__",os.environ.get("FIREBASE_AUTH_DOMAIN",""))
          text=text.replace("__FIREBASE_PROJECT_ID__",os.environ.get("FIREBASE_PROJECT_ID",""))
          text=text.replace("__FIREBASE_STORAGE_BUCKET__",os.environ.get("FIREBASE_STORAGE_BUCKET",""))
          text=text.replace("__FIREBASE_MESSAGING_SENDER_ID__",os.environ.get("FIREBASE_MESSAGING_SENDER_ID",""))
          text=text.replace("__FIREBASE_APP_ID__",os.environ.get("FIREBASE_APP_ID",""))
          p.write_text(text,encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check nutrition-engine.js
          node --check api-clients.js
          node --check regional-data.js
          node --check health-screen.js
          node --check firebase-sync.js
          node --check enhancements.js

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js config.js firebase-sync.js enhancements.js manifest.json sw.js README.md FIREBASE_SETUP.md IMAGE_NOTES.md firestore.rules _site/
          cp regional-data.js nutrition-engine.js api-clients.js food-catalog.js health-screen.js svg-icons.js demo-dataset.js ui-effects.js proxy-worker.example.js _site/
          cp -r assets _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
